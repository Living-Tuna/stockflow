name: Build & publish scanner bridge

on:
  workflow_dispatch:
  push:
    tags:
      - 'scanner-bridge-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner-bridge/package-lock.json

      - name: Install dependencies
        working-directory: scanner-bridge
        run: npm ci

      - name: Build installer
        working-directory: scanner-bridge
        run: npx electron-builder ${{ matrix.args }}
        env:
          # Keep non-signed local CI builds working (icon/metadata via rcedit on win)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          fail_on_unmatched_files: false
          draft: false
          prerelease: false
          files: scanner-bridge/dist/ecbills-scanner-bridge-setup.exe
            scanner-bridge/dist/ecbills-scanner-bridge.AppImage
name: Build & publish scanner bridge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload installers to'
        required: false
        default: 'scanner-bridge-v1.0.0'
  push:
    tags:
      - 'scanner-bridge-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner-bridge/package-lock.json

      - name: Install dependencies
        working-directory: scanner-bridge
        run: npm ci

      - name: Build installer
        working-directory: scanner-bridge
        run: npx electron-builder ${{ matrix.args }}
        env:
          # Keep non-signed local CI builds working (icon/metadata via rcedit on win)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to GitHub release
        working-directory: scanner-bridge
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          UPLOAD_FILES=()
          if [ -f dist/ecbills-scanner-bridge-setup.exe ]; then
            UPLOAD_FILES+=("dist/ecbills-scanner-bridge-setup.exe")
          fi
          if [ -f dist/ecbills-scanner-bridge.AppImage ]; then
            UPLOAD_FILES+=("dist/ecbills-scanner-bridge.AppImage")
          fi
          if [ ${#UPLOAD_FILES[@]} -gt 0 ]; then
            gh release upload "$TAG" "${UPLOAD_FILES[@]}" \
              --repo "${{ github.repository }}" --clobber
          fi
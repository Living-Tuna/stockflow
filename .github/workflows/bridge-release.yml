name: Build & publish scanner bridge

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag to upload installers to'
        required: false
        default: 'scanner-bridge-v1.1.0'
  push:
    tags:
      - 'scanner-bridge-*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: --linux
          - os: windows-latest
            args: --win
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: scanner-bridge/package-lock.json

      - name: Install dependencies
        working-directory: scanner-bridge
        run: npm ci

      - name: Build installer
        working-directory: scanner-bridge
        run: npx electron-builder ${{ matrix.args }}
        env:
          # Keep non-signed local CI builds working (icon/metadata via rcedit on win)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Publish to GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}"
          REPO="${{ github.repository }}"
          VERSION="${TAG#scanner-bridge-}"
          PKG_VERSION="$(node -p "require('./scanner-bridge/package.json').version")"

          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::warning::Tag $TAG does not match scanner-bridge/package.json version $PKG_VERSION"
          fi

          UPLOAD_FILES=()
          for f in scanner-bridge/dist/ecbills-scanner-bridge-setup.exe \
                   scanner-bridge/dist/ecbills-scanner-bridge.AppImage; do
            if [ -f "$f" ]; then UPLOAD_FILES+=("$f"); fi
          done
          if [ ${#UPLOAD_FILES[@]} -eq 0 ]; then
            echo "::error::No installers were produced by this build"
            exit 1
          fi

          # Create the release (and tag) when it does not exist yet.
          # Parallel matrix jobs may race here, hence the tolerated failure.
          if ! gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            NOTES_ARGS=(--generate-notes)
            NOTES_FILE="$(mktemp)"
            if [ -f CHANGELOG.md ] && \
               awk -v ver="$VERSION" '
                 $0 ~ "^## \\[bridge " ver "\\]" { found = 1; next }
                 found && /^## \[/ { exit }
                 found { print }
               ' CHANGELOG.md > "$NOTES_FILE" && [ -s "$NOTES_FILE" ]; then
              NOTES_ARGS=(--notes-file "$NOTES_FILE")
            fi
            gh release create "$TAG" --repo "$REPO" \
              --title "ecbills Scanner Bridge $VERSION" "${NOTES_ARGS[@]}" \
              || echo "::notice::Release $TAG already exists (created by another job)"
          fi

          gh release upload "$TAG" "${UPLOAD_FILES[@]}" --repo "$REPO" --clobber
          echo "Uploaded ${UPLOAD_FILES[*]} to release $TAG"